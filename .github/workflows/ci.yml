name: CI

# Runs the server tests and the Swift check on every push to main and on pull requests, on the same
# macOS the Release workflow builds on, so a failure shows here before a release is published (a
# published tag never moves, so a failing release costs a version). The page checks need Playwright
# from the design system's repository and run on a developer's Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26   # Xcode 26: the Swift check compiles the app's dictation (SpeechAnalyzer)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun test
      - run: sh test/swift-check.sh
