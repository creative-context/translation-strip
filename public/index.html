<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Strip</title>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="design-base.css">
<link rel="stylesheet" href="design-components.css">
<script src="design-icons.js"></script>
<style>
  /* The strip fills its window: as wide as the window, 145 pt tall in the app. */
  body { --msg: 14px; --msg-lh: 20px; }
  body.embed textarea, body.embed input { cursor: text !important; }
  /* The family's base turns selection off in the app. The text boxes keep it, read-only too: under
     user-select: none WebKit won't select in a read-only box, and the translation is read-only in
     every state but Ready, so it couldn't be copied while Teams had a draft or the text was out of date. */
  body.embed textarea, body.embed input { -webkit-user-select: text; user-select: text; }

  /* Two panels, each with its own controls: the Spanish side writes and translates, the English
     side adjusts and sends. No separate bar, so the text gets the height. */
  /* In the app the window is clear and rounded like the strip, so only the strip shows: the family's
     body color, as in Session Monitor's window, with the boxes as veils on it. */
  body.embed { background: transparent; }
  .strip { position: relative; width: 100%; height: min(100vh, 360px); /* the window's height: 145 pt until the user drags it taller */ border-radius: var(--radius-raised); background: var(--color-background-body);
    padding: 8px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; min-height: 0; }
  .f { position: relative; display: grid; grid-template-rows: 1fr auto; gap: 6px; min-height: 0; min-width: 0;
    border-radius: var(--radius-container); padding: 7px 12px 8px; background: var(--color-background-card);
    transition: background-color 240ms var(--ease-standard); }
  /* Surfaces, no lines: the boxes stand apart by their tone only. The Spanish box always has a
     surface, since that's where you write; the English side stays flat until there's English. */
  .f.es { background: var(--obsidian-veil-selected); }
  .f.es:focus-within { background: var(--color-overlay-pressed); }
  /* Two rows, so both footers sit on the same line; the adjust row takes a third only while it's open. */
  .f.en { background: transparent; }
  [data-adjust="open"] .f.en { grid-template-rows: 1fr auto auto; row-gap: 4px; }
  .foot { display: flex; align-items: center; gap: 8px; height: 28px; min-width: 0; margin: 0 -4px; }
  .foot .grow { flex: 1; }
  .en-wrap { position: relative; min-height: 0; }
  textarea { all: unset; box-sizing: border-box; display: block; width: 100%; height: 100%; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: var(--msg); line-height: var(--msg-lh); color: var(--color-text-primary); cursor: text; }
  textarea::placeholder { color: var(--color-text-secondary); }
  /* Where the keyboard is: the caret takes the accent. */
  textarea, .adjust-row .field { caret-color: var(--color-text-accent); }
  .tagrow { display: flex; flex: 0 1 auto; align-items: center; gap: 8px; min-height: 20px; min-width: 0; }
  /* The notice gives way before the chat's name does: its words end in an ellipsis and its title holds them whole. */
  .status { display: inline-flex; flex-shrink: 2; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; overflow: hidden; }
  .status:empty { display: none; }
  .status.tag { height: 20px; }
  .btn.adjust-btn, .actions .btn, #chip { height: 24px; font-size: var(--csm-text-body); }
  .adjust-btn { flex: none; }
  #adjustBtn { margin-right: 16px; } /* 24 px to "To <chat>": Adjust edits, the name goes with Send */
  #pencil { display: inline-flex; }
  .btn kbd { font: inherit; }
  .adjust-btn svg.i { width: 12px; height: 12px; }
  /* Dictation: the mic sits where Adjust sits on the English side. Listening is yours, so it's
     neutral white, never a state color. */
  .dict-label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--csm-text-meta); color: var(--color-text-secondary); white-space: nowrap; }
  .dict-label:empty { display: none; }
  .dict-label .sdot { color: var(--color-text-primary); }
  .mic { width: 28px; height: 28px; border-radius: 50%; }
  .mic svg.i { width: 16px; height: 16px; }
  [data-dict="on"] .f.es { background: var(--color-overlay-pressed); }
  [data-dict="on"] .mic { background: var(--color-text-primary); color: var(--color-on-light); }

  /* The adjust line: a note on the translation, in Spanish or English. */
  .adjust-row { display: none; align-items: center; gap: 8px; margin: 0 -4px; }
  [data-adjust="open"] .adjust-row { display: flex; }
  .adjust-row .field { flex: 1; background: var(--color-overlay-pressed); font-size: var(--csm-text-body); }
  .adjust-row .field:focus { background: var(--color-overlay-pressed); }
  .actions { display: inline-flex; gap: 8px; flex: none; }
  .actions:empty { display: none; }
  .busy { display: none; position: absolute; left: 0; top: 0; color: var(--color-text-accent); align-items: center; gap: 8px; font-size: var(--msg); line-height: var(--msg-lh); }
  [data-state="translating"] .busy, [data-state="starting"] .busy { display: inline-flex; }
  [data-state="translating"] .en-out, [data-state="starting"] .en-out { visibility: hidden; }
  [data-state="question"] .en-out { color: var(--color-text-orange); }
  [data-state="stale"] .en-out { color: var(--color-text-secondary); text-decoration: line-through; text-decoration-color: var(--color-text-disabled); }

  /* The English side takes the family's state colors: blue working, orange needs you, green done, red error. */
  [data-state="translating"] .f.en, [data-state="starting"] .f.en, [data-state="sending"] .f.en, [data-state="adjusting"] .f.en { background: color-mix(in srgb, var(--color-accent) 16%, transparent); }
  [data-state="draft"] .f.en, [data-state="question"] .f.en { background: color-mix(in srgb, var(--color-warning) 22%, transparent); }
  /* Sent: the English stays in its box, dimmed, under the green "Sent to …" in the footer. */
  [data-sent="yes"] .en-out { color: var(--color-text-secondary); }
  .status .ok { display: inline-flex; flex: none; }
  .status .ok svg.i { width: 12px; height: 12px; }
  [data-state="sent"] .f.en, [data-state="leave"] .f.en { background: color-mix(in srgb, var(--color-success) 14%, transparent); }
  [data-state="error"] .f.en, [data-state="stale"] .f.en, [data-state="written"] .f.en { background: color-mix(in srgb, var(--color-error) 22%, transparent); }
  [data-state="ready"] .f.en { background: var(--obsidian-veil-selected); }
  [data-state="ready"] .f.en:focus-within { background: var(--color-overlay-pressed); }

  .preview { color: var(--color-text-secondary); white-space: nowrap; }
  /* The chat's name gives way first, so a notice beside it stays whole. */
  /* The chat's name gives way first (down to about "To Castellan…"), so a notice beside it stays whole. */
  .to { color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 96px; flex-shrink: 1000; margin-right: 8px; }   /* 16 px to Send: with it, not stuck to it */
  .to b { color: var(--color-text-primary); font-weight: var(--font-weight-medium); margin-left: 2px; }   /* "To" and the name read as two words */
  [data-teams="nochat"] .to, [data-teams="closed"] .to, [data-teams="unknown"] .to { display: none; }
  /* The language the English is in, before "To <chat>": "Auto · Português" when Auto chose it, or just the
     target. 16 px to "To". When it isn't the target, a click writes this one in the target instead. */
  .lang { all: unset; box-sizing: border-box; flex: none; display: inline-flex; align-items: center; gap: 0; height: 24px; padding: 0 4px; margin-right: 8px; border-radius: 6px;
    white-space: nowrap; color: var(--color-text-secondary); cursor: default; transition: background-color 160ms var(--ease-standard); }
  .lang[hidden] { display: none; }
  .lang b { color: var(--color-text-primary); font-weight: var(--font-weight-medium); }
  .lang .auto { white-space: pre; }
  .lang[aria-disabled="false"] { cursor: pointer; }
  .lang[aria-disabled="false"]:hover { background: var(--obsidian-veil-selected); }
  .lang:focus-visible { outline: 2px solid var(--color-text-accent); outline-offset: -2px; }
  [data-fit~="lang"] .lang .auto { display: none; }
  [data-fit~="nolang"] .lang { display: none; }
  .more-btn { flex: none; width: 28px; height: 28px; }
  .more-btn svg.i { width: 16px; height: 16px; }
  .send, #translate { gap: 8px; flex: none; }
  .tone, .mic { flex: none; }
  /* A narrow strip: the footers give way in steps (fitFooter). The dictation label and the preview note
     end in an ellipsis, their titles holding the words; the note gives way first. */
  .preview { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1000; }
  .dict-label { min-width: 0; }
  .dict-label .dw { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dict-label .btn { flex: none; }
  [data-fit~="keys"] .foot kbd { display: none; }
  [data-fit~="pencil"] #adjustBtn { width: 24px; padding: 0; justify-content: center; }
  [data-fit~="pencil"] #adjustBtn .lbl { display: none; }
  [data-fit~="name"] .to { min-width: 0; }
  [data-fit~="noname"] .to { display: none; }
  [data-fit~="nonotice"] #tagrow #status { display: none; }
  [data-fit~="tone"] .tone { display: none; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  /* Nothing to send or translate yet: a gray button you can still read, not a dimmed one. */
  .send:disabled, #translate:disabled { opacity: 1; background: var(--color-overlay-hover); color: var(--color-text-secondary); }

  /* The menu opens over the fields, not above the strip: the app's window is only as tall as the strip. */
  .menu { position: absolute; right: 8px; bottom: calc(8px + 8px + 28px + 6px); width: max-content; max-width: calc(100% - 16px); padding: 6px;
    border-radius: var(--radius-raised); background: var(--color-surface-raised); box-shadow: var(--shadow-raised); display: none; z-index: 5; gap: 6px; }
  .menu.open { display: flex; }
  .menu .col { display: flex; flex-direction: column; min-width: 0; }
  .menu .mh { padding: 6px 8px 4px 28px; font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); min-height: 24px; }
  .menu button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .menu button:hover { background: var(--obsidian-veil-selected); }
  .menu button:focus-visible { outline: 2px solid var(--color-text-accent); outline-offset: -2px; }
  .menu button .ck { width: 12px; color: var(--color-text-accent); visibility: hidden; }
  .menu button[aria-checked="true"] .ck { visibility: visible; }
  /* The settings: what ⌘⏎ does, the model and the position, three rows of buttons each with its
     label on the left, so they fit the strip's height with no title row; the commands sit beside them. */
  .menu .prow { display: flex; align-items: center; gap: 8px; height: 26px; }
  .menu .prow .pl { flex: none; width: 52px; padding-left: 8px; font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); }
  .menu .posrow { display: flex; gap: 2px; }
  .menu .posrow button { width: auto; min-width: 28px; height: 24px; padding: 0 8px; justify-content: center; color: var(--color-text-primary); }
  .menu .posrow button[aria-checked="true"] { background: var(--color-overlay-pressed); }
  .menu hr { border: 0; width: 1px; background: var(--obsidian-veil-selected); margin: 4px 0; align-self: stretch; }
  /* Four settings in a 2 x 2 grid of rows (On ⌘⏎, Model / Reply in, Position), so the menu keeps the strip's height. */
  .menu .col.prefs { display: grid; grid-template-columns: auto auto; grid-auto-rows: 26px; column-gap: 20px; align-content: start; align-self: start; }
  /* Reply in: Auto, a thin line, then your languages. */
  .menu .posrow .sep { flex: none; width: 1px; align-self: stretch; margin: 5px 4px; background: var(--obsidian-veil-selected); }
  .menu .langs { display: contents; }
  /* Many languages in a narrow menu: the row scrolls sideways rather than push the menu out of the window. */
  .menu .col.prefs, .menu .prow, .menu .reply { min-width: 0; }
  .menu .reply { overflow-x: auto; scrollbar-width: none; }
  .menu .reply::-webkit-scrollbar { display: none; }
  /* A narrow strip: Position leaves the menu (it's in Settings and the app menu's Layout), and the three
     rows left stack in one column, beside the commands. */
  @media (orientation: landscape) and (max-width: 719px) {
    .menu .col.prefs { grid-template-columns: minmax(0, auto); flex: 0 1 auto; }
    .menu .prow.position { display: none; }
  }

  /* A short strip (dragged below 140 pt): there's no room above the footer, so the menu opens to the
     left of the gear, as tall as the strip lets it, and the gear stays clickable. */
  @media (orientation: landscape) and (max-height: 139px) {
    .menu { bottom: 8px; right: 48px; max-width: calc(100% - 56px); gap: 4px; }
  }

  /* First run: one sentence and one button on a single veil the size of the two boxes. */
  .cover { display: none; position: absolute; inset: 8px; border-radius: var(--radius-container); background: var(--obsidian-veil-selected); z-index: 10;
    align-items: center; gap: 16px; padding: 0 12px; font-size: var(--msg); line-height: var(--msg-lh); }
  [data-access="no"] .cover { display: flex; }
  [data-access="no"] .fields { visibility: hidden; }

  /* The column: when the window is taller than it is wide (the strip's second shape, beside Teams), the
     same two boxes stack, the English on top and the Spanish below, each half the height. The English
     footer takes two rows (the notice and Adjust, then who it goes to, Send and the gear); the Spanish footer
     is the same row as today, and anything that doesn't fit on it (the dictation label, the preview note)
     takes a row of its own above it. Nothing here applies to the strip's own shape. */
  @media (orientation: portrait) {
    .strip { height: 100vh; }
    .fields { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); }
    .f.en { order: -1; }
    /* Sent: the message sits in the middle of the whole English box, so the box is its frame. */
    .en-wrap { position: static; }
    .busy { left: 12px; top: 7px; }

    /* English footer. Row 1 (a strut keeps its 28 px, so the text doesn't move when a notice comes or goes):
       the notice and its buttons, then Adjust. Row 2: who it goes to, Send, the gear. */
    .f.en .foot { flex-wrap: wrap; height: auto; row-gap: 0; align-content: flex-start; }
    .f.en .foot .grow { display: none; }
    .f.en .foot::before { content: ""; order: 0; flex: none; width: 0; height: 24px; margin: 0 -8px 4px 0; }
    .f.en .foot::after { content: ""; order: 3; flex: 0 0 100%; height: 0; }
    [data-adjust="open"] .f.en .foot::before { display: none; }
    #tagrow { order: 1; flex: 1 1 0; min-width: 0; margin-bottom: 4px; }
    #adjustBtn { order: 2; margin: 0 0 4px auto; }
    .to { order: 4; flex: 1 1 0; }
    #send { order: 5; margin-left: auto; }   /* with no chat name, Send and the gear stay at the right */
    #more { order: 6; }

    /* Spanish footer: the same row; a label that needs room goes above it. */
    .f.es .foot { flex-wrap: wrap; height: auto; row-gap: 4px; }
    .f.es .foot .preview, .f.es .foot .dict-label { order: -1; flex: 1 0 100%; min-height: 20px; }

    /* The menu stacks its groups in one column and opens over the English box, above its footer. */
    .menu { left: 8px; right: 8px; bottom: calc(50% + 74px); width: auto; max-width: none; max-height: calc(50% - 82px); overflow-y: auto; flex-direction: column; }
    .menu hr { width: auto; height: 1px; margin: 2px 8px; align-self: stretch; }
    .menu .col:last-child button { padding-left: 16px; }   /* in line with the rows' labels */
    .menu .col.prefs { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
    .menu .prow { height: auto; min-height: 26px; align-items: flex-start; }
    .menu .prow .pl { padding-top: 6px; }
    .menu .prow .posrow { flex-wrap: wrap; row-gap: 2px; padding: 1px 0; }
    .lang { order: 4; }

    /* First run: the sentence over its button, on the one veil. */
    .cover { flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; }
  }
</style>
</head>
<body>
<div class="strip" id="strip" data-state="idle" data-teams="unknown" data-access="ok" data-adjust="" data-dict="off">
  <div class="fields" id="fields">
    <div class="f es">
      <textarea class="es-in" id="es" lang="" placeholder="Write in any language" aria-label="Message to translate" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <div class="foot">
        <div class="pseg tone" id="tone"><button data-register="normal" aria-pressed="true">Normal</button><button data-register="formal" aria-pressed="false">Formal</button></div>
        <span class="preview" id="preview" title="Preview · nothing is sent" hidden>Preview · nothing is sent</span>
        <span class="grow"></span>
        <span class="dict-label" id="dictLabel"></span>
        <button class="icon-btn mic" id="mic" title="Dictate ⌘D" aria-label="Dictate" aria-pressed="false"></button>
        <button class="btn" id="translate" disabled>Translate <kbd>⏎</kbd></button>
      </div>
    </div>
    <div class="f en">
      <div class="en-wrap">
        <textarea class="en-out" id="en" lang="en" placeholder="English" aria-label="Translation" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <div class="busy"><span class="calm"><i></i><i></i><i></i></span><span id="busyText">Translating…</span></div>
      </div>
      <div class="adjust-row">
        <input class="field adj-in" id="adjIn" placeholder="What to change" aria-label="What to change" spellcheck="false" autocomplete="off" autocapitalize="off">
        <button class="btn small chip" id="chip" data-quick="más corto">Shorter</button>
      </div>
      <div class="foot">
        <div class="tagrow" id="tagrow">
          <span class="status" id="status" role="status" aria-live="polite"></span><span class="actions" id="actions"></span>
        </div>
        <span class="grow"></span>
        <button class="btn ghost small adjust-btn" id="adjustBtn" aria-label="Adjust" title="Adjust ⌘K"><span id="pencil"></span><span class="lbl">Adjust</span> <kbd>⌘K</kbd></button>
        <button class="lang" id="lang" type="button" aria-disabled="true" hidden><span class="auto">Auto · </span><b id="langName"></b></button>
        <span class="to" id="to">To <b id="chat"></b></span>
        <button class="btn primary send" id="send" disabled>Send <kbd>⌘⏎</kbd></button>
        <button class="icon-btn more-btn" id="more" aria-label="Settings" title="Settings" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </div>
  </div>
  <div class="menu" id="menu" role="menu">
    <div class="col prefs">
      <div class="prow"><span class="pl" id="modeLabel">On ⌘⏎</span><div class="posrow" role="group" aria-labelledby="modeLabel">
        <button role="menuitemradio" data-mode="send" aria-checked="true">Send</button>
        <button role="menuitemradio" data-mode="leave" aria-checked="false" title="Put in Teams without sending">Put in Teams</button>
      </div></div>
      <div class="prow"><span class="pl" id="modelLabel">Model</span><div class="posrow" role="group" aria-labelledby="modelLabel">
        <button role="menuitemradio" data-model="haiku" aria-checked="false">Haiku</button>
        <button role="menuitemradio" data-model="sonnet" aria-checked="true">Sonnet</button>
        <button role="menuitemradio" data-model="opus" aria-checked="false">Opus</button>
      </div></div>
      <div class="prow"><span class="pl" id="replyLabel">Reply in</span><div class="posrow reply" role="group" aria-labelledby="replyLabel">
        <button role="menuitemcheckbox" data-auto aria-checked="false" title="Follow the chat's language when it's clear">Auto</button><span class="sep" aria-hidden="true"></span><span class="langs" id="langBtns"></span>
      </div></div>
      <div class="prow position"><span class="pl" id="positionLabel">Position</span><div class="posrow" role="group" aria-labelledby="positionLabel">
        <button role="menuitemradio" data-layout="automatic" aria-checked="true" title="Automatic" aria-label="Automatic">Auto</button>
        <button role="menuitemradio" data-layout="below" aria-checked="false" title="Below Teams" aria-label="Below Teams">↓</button>
        <button role="menuitemradio" data-layout="above" aria-checked="false" title="Above Teams" aria-label="Above Teams">↑</button>
        <button role="menuitemradio" data-layout="left" aria-checked="false" title="Left of Teams" aria-label="Left of Teams">←</button>
        <button role="menuitemradio" data-layout="right" aria-checked="false" title="Right of Teams" aria-label="Right of Teams">→</button>
      </div></div>
    </div>
    <hr>
    <div class="col">
      <button role="menuitem" data-do="guide">Open voice guide</button>
      <button role="menuitem" data-do="restart">Restart translator</button>
    </div>
  </div>
  <div class="cover"><span>Allow Accessibility to send messages in Teams.</span><button class="btn primary" id="accessBtn">Open System Settings</button></div>
</div>

<script src="strip-state.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// The strip's page. State comes from the server (/api/stream); the Spanish, the English and what
// is happening to them live in strip-state.js (plain functions, no DOM); this file keeps the
// elements, the events, the bridge and the requests. The shell and the stand-in bridge are
// described in docs/contract.md. Nothing here stores a message, and nothing logs one.
// ---------------------------------------------------------------------------------------------
const SS = window.StripState;
const $ = id => document.getElementById(id);
const box = $("strip"), esIn = $("es"), enOut = $("en"), adjIn = $("adjIn"), menu = $("menu"), moreBtn = $("more");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ic = n => DesignIcons.svg(n);

// The design system has no mic yet: drawn on its 24 px grid and stroke, to add to mac-app-design before it is vendored.
const MIC = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>`;
$("mic").innerHTML = MIC;
// The settings button: a gear, drawn the same way (eight teeth, the same stroke), also to add to mac-app-design.
const GEAR = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.14 5.05 L10.42 2.53 L13.58 2.53 L13.86 5.05 A7.2 7.2 0 0 1 15.6 5.76 L17.57 4.18 L19.82 6.43 L18.24 8.4 A7.2 7.2 0 0 1 18.95 10.14 L21.47 10.42 L21.47 13.58 L18.95 13.86 A7.2 7.2 0 0 1 18.24 15.6 L19.82 17.57 L17.57 19.82 L15.6 18.24 A7.2 7.2 0 0 1 13.86 18.95 L13.58 21.47 L10.42 21.47 L10.14 18.95 A7.2 7.2 0 0 1 8.4 18.24 L6.43 19.82 L4.18 17.57 L5.76 15.6 A7.2 7.2 0 0 1 5.05 13.86 L2.53 13.58 L2.53 10.42 L5.05 10.14 A7.2 7.2 0 0 1 5.76 8.4 L4.18 6.43 L6.43 4.18 L8.4 5.76 A7.2 7.2 0 0 1 10.14 5.05Z"/><circle cx="12" cy="12" r="3"/></svg>`;
$("more").innerHTML = GEAR;
$("pencil").innerHTML = ic("pencil");
for (const s of document.querySelectorAll("[data-ic]")) s.innerHTML = ic(s.dataset.ic);

// ------------------------------------------------------------------------------ the bridge
const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.strip;
const inApp = !!handler;
document.body.classList.toggle("embed", inApp);
$("preview").hidden = inApp;

function post(msg) {
  if (handler) { try { handler.postMessage(msg); } catch (e) {} }
  else standIn(msg);
}

// The stand-in bridge, for a browser with no shell: a made-up chat and a made-up last message, and a
// send that succeeds after a moment without sending anything. The query string picks a case to
// try: ?teams=closed|nochat  ?chat=pt|new  ?shape=unknown|several  ?draft=1  ?access=0  ?mic=denied  ?dict=prep|unavailable
// ?send=draft|no-teams|no-chat|not-front|mismatch|not-sent|chat-changed|no-paste|not-own-server|no-access
const qp = new URLSearchParams(location.search);
const PREVIEW_DICTATION = "¿Puedes revisar el presupuesto antes del jueves? Si hace falta, lo vemos en la llamada.".split(" ");
let previewTimer;
function previewTeams() {
  const t = qp.get("teams");
  if (t === "closed") return { open: false, chat: null, from: null, last: null, draft: false, shape: "ok" };
  const shape = ["unknown", "several"].includes(qp.get("shape")) ? qp.get("shape") : "ok";
  if (t === "nochat") return { open: true, chat: null, from: null, last: null, draft: false, shape };
  // ?chat=pt: the last message is in Portuguese; ?chat=new: a chat with no message yet.
  if (qp.get("chat") === "new") return { open: true, chat: "Daniel Okafor", from: null, last: null, draft: qp.get("draft") === "1", shape };
  const last = qp.get("chat") === "pt" ? "Você consegue revisar o orçamento até quinta?" : "Could you send me the budget numbers before Thursday?";
  return { open: true, chat: "Priya Raman", from: "Priya Raman", last, draft: qp.get("draft") === "1", shape };
}
function standIn(msg) {
  if (msg.type === "ready") {
    setTimeout(() => {
      window.strip.access({ accessibility: qp.get("access") !== "0", microphone: qp.get("mic") === "denied" ? "denied" : "unknown" });
      window.strip.teams(previewTeams());
      window.strip.layout({ value: "automatic" });
    }, 0);
  } else if (msg.type === "layout") {
    setTimeout(() => window.strip.layout({ value: msg.value }), 0); // the stand-in moves nothing
  } else if (msg.type === "send") {
    setTimeout(() => {
      const why = qp.get("send");
      if (why && !(why === "draft" && msg.afterDraft)) window.strip.sent({ ok: false, reason: why });
      else window.strip.sent({ ok: true });
    }, 800);
  } else if (msg.type === "dictation") {
    clearInterval(previewTimer);
    if (msg.action === "start") {
      if (qp.get("mic") === "denied") { window.strip.dictation({ state: "denied" }); return; }
      if (qp.get("dict") === "unavailable") { window.strip.dictation({ state: "unavailable" }); return; }
      let n = 0;
      const listen = () => {
        window.strip.dictation({ state: "on", text: "" });
        previewTimer = setInterval(() => {
        n++;
        window.strip.dictation({ state: n >= PREVIEW_DICTATION.length ? "off" : "on", text: PREVIEW_DICTATION.slice(0, n).join(" ") });
        if (n >= PREVIEW_DICTATION.length) clearInterval(previewTimer);
        }, 160);
      };
      // ?dict=prep: the first time, macOS downloads its Spanish model before listening.
      if (qp.get("dict") === "prep") {
        window.strip.dictation({ state: "preparing" });
        [0.2, 0.55, 0.9].forEach((p, i) => setTimeout(() => window.strip.dictation({ state: "preparing", progress: p }), 300 * (i + 1)));
        previewTimer = setTimeout(listen, 1500);
      }
      else listen();
    } else if (msg.action === "stop") {
      clearTimeout(previewTimer);
      window.strip.dictation({ state: "off" });
    }
  }
}

// ------------------------------------------------------------------------------ the state
// st is strip-state.js's state, replaced whole by each transition. commit() takes the new one and
// writes the boxes the state wrote (the English that came back, the Spanish dictation heard).
let st = SS.create();
let sendWatch = 0, dictTimer = 0, dictThen = null;
const fields = () => ({ es: esIn.value, en: enOut.value });
function commit(n) {
  const old = st;
  st = n;
  if (n.enSeq !== old.enSeq) enOut.value = n.en;
  if (n.esSeq !== old.esSeq) esIn.value = n.esText;
  if (!n.dictStopping && dictThen) { dictThen = null; clearTimeout(dictTimer); }   // what waited on the last words is dropped
}
const stopMsg = { type: "dictation", action: "stop" };

// What the shell tells the page (and what the stand-in tells it).
window.strip = {
  teams(m) { commit(SS.shellTeams(st, m)); paint(); },
  sent(m) { onSent(m || {}); },
  dictation(m) { onDictation(m || {}); },
  access(m) {
    const r = SS.shellAccess(st, m);
    if (r.stopDictation) post(stopMsg);
    commit(r.st); paint();
  },
  focus() { esIn.focus(); },
  layout(m) { commit(SS.shellLayout(st, m)); paint(); },
};

// ------------------------------------------------------------------------------ the server
let srv = null;       // { translator, settings, … } from /api/state
const DEFAULT_SETTINGS = { model: "sonnet", mode: "send", target: "English", auto: false, languages: ["English"], dictation: "es-MX" };
const settings = () => Object.assign({}, DEFAULT_SETTINGS, srv && srv.settings);
// Each language's code, for the boxes' and the buttons' lang attribute (spelling and voices).
const LANG_CODES = { English: "en", "Español": "es", "Português": "pt", "Français": "fr", Deutsch: "de", Italiano: "it", Nederlands: "nl", Polski: "pl", Svenska: "sv", "Türkçe": "tr", "日本語": "ja", "한국어": "ko", "中文": "zh" };

let source, lastBeat = Date.now(), backoff = 1000, reconnectTimer = 0;
function connect() {
  clearTimeout(reconnectTimer); reconnectTimer = 0;
  try { if (source) source.close(); } catch (e) {}
  source = new EventSource("/api/stream");
  source.onmessage = e => {
    lastBeat = Date.now(); backoff = 1000;
    try { srv = JSON.parse(e.data); } catch (err) { return; }
    paint();
  };
  source.addEventListener("ping", () => { lastBeat = Date.now(); });
  source.onerror = () => {
    try { source.close(); } catch (e) {}
    if (!reconnectTimer) { reconnectTimer = setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 5000); }
  };
}
// The server pings every 9 s; silence for 25 s means a dead connection that never closed.
setInterval(() => { if (Date.now() - lastBeat > 25000) { lastBeat = Date.now(); connect(); } }, 5000);

async function api(path, body) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}), signal: ctl.signal });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    return { status: r.status, data: data && typeof data === "object" ? data : {} };
  } catch (e) {
    return { status: 0, data: { error: "failed" } };
  } finally { clearTimeout(timer); }
}
// One request at a time on the server: a "busy" waits and asks again, for as long as this ask is still the current one.
async function ask(path, body, id) {
  const until = Date.now() + 50000;
  for (;;) {
    const r = await api(path, body);
    if (id !== st.req) return null;
    if (r.status === 409 && r.data.error === "busy" && Date.now() < until) { await sleep(700); if (id !== st.req) return null; continue; }
    return r;
  }
}

// When the footers don't fit (a narrow Teams window, a long notice), they give way in steps, the
// fewest that make each fit. The chat's name shortens first, down to its 96 px (that's its flex
// shrink). Then the shortcut hints leave the buttons (the keys still work, and the titles say
// them), then Adjust keeps only its pencil, then the language button drops its "Auto · " (the name
// stays, and its title says how it was chosen), then the notice's words end in an ellipsis (its title
// holds them, and its buttons stay whole), then the chat's name goes below 96 px, then it leaves
// the row, then the language button leaves, and last the notice's words leave too. (Flex shrink alone takes a fraction of a pixel
// from the notice, which is enough to cut its last letters: so the notice can't shrink until then.)
function fitFooter() {
  // The preview note shows only in a browser, gives way to what the dictation label says, and leaves
  // rather than end in an ellipsis.
  const pv = $("preview");
  pv.hidden = inApp || $("dictLabel").childNodes.length > 0;
  fitSteps();
  if (!pv.hidden && pv.scrollWidth > pv.clientWidth + 1) { pv.hidden = true; fitSteps(); }
}
function fitSteps() {
  const row = $("tagrow"), acts = $("actions"), status = $("status");
  const en = box.querySelector(".f.en .foot"), es = box.querySelector(".f.es .foot");
  // In the column the English footer wraps instead of overflowing: there, it doesn't fit when the language,
  // the name, Send and the gear no longer share one line.
  const col = window.innerHeight >= window.innerWidth;
  const line = () => {
    const tops = ["lang", "to", "send", "more"].map((id) => $(id)).filter((e) => e.offsetWidth > 0).map((e) => e.getBoundingClientRect());
    return tops.some((r) => Math.abs(r.top + r.height / 2 - (tops[tops.length - 1].top + tops[tops.length - 1].height / 2)) > 4);
  };
  const over = (f) => f.scrollWidth > f.clientWidth + 1 || (col && f === en && line());
  const fit = [];
  const step = (s) => { fit.push(s); box.dataset.fit = fit.join(" "); };
  const notice = (dot) => {
    row.style.flexShrink = "";
    row.style.minWidth = `${(acts.firstChild ? acts.offsetWidth : 0) + (status.firstChild && dot ? 34 : 0) + (acts.firstChild && status.firstChild && dot ? 8 : 0)}px`;
  };
  row.style.flexShrink = "0"; row.style.minWidth = "";
  box.dataset.fit = "";
  // The dictation label keeps its button whole and a few of its words; the rest end in an ellipsis.
  const dl = $("dictLabel"), dlBtn = dl.querySelector(".btn");
  dl.style.minWidth = "";
  if (dl.firstChild) dl.style.minWidth = `${Math.min(dl.scrollWidth, (dlBtn ? dlBtn.offsetWidth + 8 : 0) + 64)}px`;
  // Both footers lose their shortcut hints together, so the buttons look alike.
  if (over(en) || over(es)) step("keys");
  // The English footer, in its order. Every step is undone on the next paint or resize.
  if (over(en)) step("pencil");
  if (over(en) && !$("lang").hidden && !$("lang").querySelector(".auto").hidden) step("lang");   // "Auto · " leaves; the title still says it
  if (over(en)) notice(true);          // the notice shortens down to its dot; its buttons stay whole
  if (over(en)) step("name");
  if (over(en)) step("noname");
  if (over(en) && !$("lang").hidden) step("nolang");   // a notice with its buttons wins over the language, for now
  if (over(en)) { step("nonotice"); notice(false); }   // the box's color and the buttons still say it
  // The Spanish footer: Normal and Formal step aside last, only while a dictation label needs the room.
  if (over(es)) step("tone");
}
window.addEventListener("resize", () => fitFooter());

// The menu's Reply in row: Auto, then one button per language in the settings, the target pressed.
// The buttons are rebuilt only when the list changes, so one under the pointer isn't replaced.
let langsDrawn = "";
function paintReplyIn() {
  const s = settings(), langs = Array.isArray(s.languages) && s.languages.length ? s.languages : [s.target];
  const sig = JSON.stringify(langs);
  if (sig !== langsDrawn) {
    langsDrawn = sig;
    $("langBtns").replaceChildren(...langs.map((name) => {
      const b = document.createElement("button");
      b.setAttribute("role", "menuitemradio");
      b.dataset.target = name; b.textContent = name; b.lang = LANG_CODES[name] || "";
      return b;
    }));
  }
  menu.querySelector("[data-auto]").setAttribute("aria-checked", String(!!s.auto));
  for (const b of menu.querySelectorAll("[data-target]")) {
    b.setAttribute("aria-checked", String(b.dataset.target === s.target));
    if (b.dataset.target === s.target) b.title = "Your target language"; else b.removeAttribute("title");
  }
}

let drawn = "";
function paint() {
  const f = fields(), v = SS.view(st, srv), t = st.teams, open = st.adjustOpen && SS.canAdjust(st, f);
  box.dataset.state = v.state;
  box.dataset.teams = SS.dataTeams(st);
  box.dataset.access = st.access.accessibility === false ? "no" : "ok";
  box.dataset.adjust = open ? "open" : "";
  box.dataset.dict = st.dict;
  $("fields").inert = st.access.accessibility === false;
  $("busyText").textContent = v.state === "starting" ? "Starting translator…" : "Translating…";
  $("chat").textContent = (t && t.chat) || "";
  $("to").title = (t && t.chat) || "";
  esIn.readOnly = st.phase === "sending";
  // Ready, or an empty strip, where what you type in it is the message (SS.editedEnglish).
  enOut.readOnly = !(st.phase === "ready" || (st.phase === "idle" && st.dict !== "on"));

  const send = $("send");
  send.disabled = !SS.canSend(st, f, false);
  send.innerHTML = `${settings().mode === "leave" ? "Put in Teams" : "Send"} <kbd>⌘⏎</kbd>`;
  $("translate").disabled = !SS.canTranslate(st, f);
  for (const b of document.querySelectorAll("#tone button")) b.setAttribute("aria-pressed", b.dataset.register === st.register);
  for (const b of menu.querySelectorAll("[data-mode]")) b.setAttribute("aria-checked", b.dataset.mode === settings().mode);
  for (const b of menu.querySelectorAll("[data-model]")) b.setAttribute("aria-checked", b.dataset.model === settings().model);
  for (const b of menu.querySelectorAll("[data-layout]")) b.setAttribute("aria-checked", b.dataset.layout === st.layout);
  paintReplyIn();

  // The translation box waits for the target; the language button names what the translation is in.
  const target = settings().target, lv = SS.langView(st, target), lb = $("lang");
  enOut.placeholder = target;
  enOut.lang = LANG_CODES[(lv && lv.name) || target] || "";
  lb.hidden = !lv;
  if (lv) {
    lb.querySelector(".auto").hidden = !lv.auto;
    $("langName").textContent = lv.name;
    $("langName").lang = LANG_CODES[lv.name] || "";
    lb.title = lv.title;
    lb.setAttribute("aria-disabled", String(!SS.canRetarget(st, f, target)));
  }

  $("adjustBtn").style.display = SS.canAdjust(st, f) && !open ? "" : "none";
  $("tagrow").style.display = (v.tag || v.actions.length) && !open ? "" : "none";
  box.dataset.sent = v.sent ? "yes" : "";
  // The tag and its buttons are redrawn only when they change, so a button under the pointer isn't rebuilt.
  const sig = JSON.stringify([v.tag, v.actions]);
  if (sig !== drawn) {
    drawn = sig;
    const status = $("status"), actions = $("actions");
    status.replaceChildren(); actions.replaceChildren();
    if (v.tag) {
      status.className = `status tag s-${v.tag.kind}`;
      status.title = v.tag.title || v.tag.text;   // the whole words, when the tag has to shorten them
      const mark = document.createElement("span");
      if (v.tag.kind === "working") { mark.className = "calm"; mark.innerHTML = "<i></i><i></i><i></i>"; }
      else if (v.tag.kind === "done") { mark.className = "ok"; mark.innerHTML = ic("check"); }
      else mark.className = v.tag.kind === "needs" || v.tag.kind === "asks" ? "pdot" : "sdot";
      const words = document.createElement("span");
      words.textContent = v.tag.text;
      status.append(mark, words);
    } else { status.className = "status"; status.removeAttribute("title"); }
    for (const a of v.actions) {
      const b = document.createElement("button");
      b.className = `btn${a.ghost ? " ghost" : ""} small`;
      b.dataset.act = a.act; b.textContent = a.label;
      actions.append(b);
    }
  }

  const label = $("dictLabel"), dl = SS.dictLabel(st);
  label.replaceChildren();
  // The words sit in their own span, so they can end in an ellipsis when the strip is narrow; the title holds them.
  const words = (text) => { const w = document.createElement("span"); w.className = "dw"; w.textContent = text; label.title = text; return w; };
  label.removeAttribute("title");
  if (dl && dl.kind === "prep") label.append(words(dl.text));
  else if (dl && dl.kind === "listening") { label.innerHTML = `<span class="sdot"></span>`; label.append(words("Listening")); }
  else if (dl && dl.kind === "note") label.append(words(dl.text));
  else if (dl && dl.kind === "denied") {
    label.append(words("Microphone not allowed"));
    const b = document.createElement("button");
    b.className = "btn ghost small"; b.dataset.act = "mic-settings"; b.textContent = "Open Settings";
    label.append(b);
  }
  $("mic").setAttribute("aria-pressed", st.dict === "on");
  // (the preview note: fitFooter, below, which knows the room it has)

  fitFooter();
}

// ------------------------------------------------------------------------------ translating and adjusting
// target: a one-time language for this translation only (the language button's click).
async function translate(target) {
  const go = SS.translateStart(st, fields(), { auto: settings().auto, target: typeof target === "string" ? target : undefined });
  if (!go) return;
  commit(go.st);
  paint();
  const r = await ask("/api/translate", go.body, st.req);
  if (!r) return;
  commit(SS.translateDone(st, fields(), r.data));
  paint();
}

function openAdjust() {
  if (!SS.canAdjust(st, fields())) return;
  commit(SS.setAdjustOpen(st, true)); paint();
  adjIn.value = ""; adjIn.focus();
}
function closeAdjust(focusBack) { commit(SS.setAdjustOpen(st, false)); paint(); if (focusBack) esIn.focus(); }

async function adjust(note) {
  const go = SS.adjustStart(st, fields(), note, settings().target);
  if (!go) return;
  commit(go.st);
  paint();
  const r = await ask("/api/adjust", go.body, st.req);
  if (!r) return;
  const res = SS.adjustDone(st, fields(), r.data);
  commit(res.st);
  if (res.focus) esIn.focus();
  paint();
}

function undo() { commit(SS.undo(st)); paint(); }

function setRegister(reg) {
  const r = SS.setRegister(st, reg, fields());
  commit(r.st); paint();
  if (r.again) translate();   // the answer in flight, or the English on show, was for the other register
}

// ------------------------------------------------------------------------------ sending
function send(afterDraft) {
  const go = SS.sendStart(st, fields(), afterDraft, settings().mode);
  if (!go) return;
  clearTimeout(sendWatch);
  commit(go.st);
  paint();
  post(go.msg);
  // The shell always answers. If it doesn't, the strip must not stay stuck.
  sendWatch = setTimeout(() => {
    if (st.phase !== "sending") return;
    commit(SS.sendTimeout(st)); paint();
  }, 20000);
}

function onSent(m) {
  if (st.phase !== "sending") return;
  clearTimeout(sendWatch);
  commit(SS.sendDone(st, m, SS.clock(new Date())));
  paint();
  if (st.phase === "sent" || st.phase === "leave") esIn.focus();
}

// ------------------------------------------------------------------------------ dictation
function startDictation() {
  const loc = settings().dictation, opt = ((srv && srv.options && srv.options.dictation) || []).find((d) => d && d.id === loc);
  const go = SS.dictStart(st, fields(), loc, opt ? opt.name : "");
  if (!go) return;
  commit(go.st); paint(); esIn.focus();
  post(go.msg);
}
// Stop, then run `then` once the last words have come in (or after a moment if they don't).
function stopDictation(then) {
  const go = SS.dictStop(st);
  if (!go) { if (then) then(); return; }
  commit(go.st); paint();
  clearTimeout(dictTimer);
  dictThen = () => { clearTimeout(dictTimer); dictThen = null; commit(SS.dictFinish(st)); paint(); if (then) then(); };
  dictTimer = setTimeout(() => { if (dictThen) dictThen(); }, 1800); // longer than the shell's 1.5 s wait for the final result
  post(go.msg);   // after the above: the stand-in answers at once
}
function onDictation(m) {
  const r = SS.onDictation(st, m, fields());
  commit(r.st);
  if (r.done) {
    if (dictThen) { dictThen(); return; }
    commit(SS.dictFinish(st));
  }
  paint();
}
function toggleDictation() { if (st.dict === "on") stopDictation(); else startDictation(); }

// ------------------------------------------------------------------------------ the fields
// The Spanish changed: an answer for the old text no longer counts; a translation of it is out of date.
function onSpanishInput() { commit(SS.typed(st, fields())); paint(); }
esIn.addEventListener("input", onSpanishInput);
enOut.addEventListener("input", () => { commit(SS.editedEnglish(st, enOut.value, fields(), settings().target)); paint(); });

function clearAll() {
  const r = SS.clearAll(st);
  if (r.stopDictation) post(stopMsg);
  commit(r.st);
  paint(); esIn.focus();
}

function closeMenu() { menu.classList.remove("open"); moreBtn.setAttribute("aria-expanded", "false"); }

document.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  const k = e.key;
  if (e.metaKey && !e.ctrlKey && !e.altKey) {
    const l = k.toLowerCase();
    if (l === "k") { e.preventDefault(); openAdjust(); }
    else if (l === "d") { e.preventDefault(); toggleDictation(); }
    else if (k === "Enter") { e.preventDefault(); if (st.dict === "on") stopDictation(() => send(false)); else send(false); }
    return;
  }
  if (k === "Escape") {
    e.preventDefault();
    if (menu.classList.contains("open")) closeMenu();
    else if (box.dataset.adjust === "open") closeAdjust(true);
    else if (st.phase !== "sending") clearAll();
    return;
  }
  if (k === "Enter" && !e.shiftKey) {
    if (e.target === esIn) { e.preventDefault(); if (st.dict === "on") stopDictation(translate); else translate(); }
    else if (e.target === adjIn) { e.preventDefault(); adjust(adjIn.value); }
  }
});

$("mic").onclick = toggleDictation;
$("adjustBtn").onclick = openAdjust;
$("chip").onclick = () => adjust($("chip").dataset.quick);
$("send").onclick = () => send(false);
$("translate").onclick = () => { if (st.dict === "on") stopDictation(translate); else translate(); esIn.focus(); };
// The language isn't the target: write this one in the target (Auto off, for this translation only).
$("lang").onclick = () => { const target = settings().target; if (SS.canRetarget(st, fields(), target)) translate(target); };
$("accessBtn").onclick = () => post({ type: "open", what: "accessibility" });
for (const b of document.querySelectorAll("#tone button")) b.onclick = () => setRegister(b.dataset.register);

box.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  switch (a.dataset.act) {
    case "retry": translate(); break;
    case "retry-adjust": commit(SS.clearNotice(st)); adjust(st.lastNote); break;
    case "undo": undo(); esIn.focus(); break;
    case "add": send(true); break;
    case "cancel": commit(SS.cancelDraft(st)); paint(); esIn.focus(); break;
    case "open-teams": post({ type: "open", what: "teams" }); break;
    case "guide": post({ type: "open", what: "guide" }); break;
    case "mic-settings": post({ type: "open", what: "microphone" }); break;
  }
});

// ------------------------------------------------------------------------------ the settings menu (the gear)
moreBtn.onclick = e => {
  e.stopPropagation();
  const open = menu.classList.toggle("open");
  moreBtn.setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", e => { if (!menu.contains(e.target) && e.target !== moreBtn) closeMenu(); });

async function setSettings(patch) {
  const before = srv;
  srv = Object.assign({}, srv, { settings: Object.assign({}, settings(), patch) });
  paint();
  const r = await api("/api/settings", patch);
  if (r.status === 200 && r.data.settings) srv = Object.assign({}, srv, { settings: r.data.settings });
  else srv = before;
  paint();
}
menu.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) setSettings({ mode: b.dataset.mode });
  else if ("auto" in b.dataset) setSettings({ auto: !settings().auto });
  else if (b.dataset.target) setSettings({ target: b.dataset.target });
  else if (b.dataset.model) setSettings({ model: b.dataset.model });
  // The shell moves the strip and says the new setting back (window.strip.layout).
  else if (b.dataset.layout) { post({ type: "layout", value: b.dataset.layout }); commit(SS.shellLayout(st, { value: b.dataset.layout })); paint(); }
  else if (b.dataset.do === "guide") { post({ type: "open", what: "guide" }); closeMenu(); }
  else if (b.dataset.do === "restart") { api("/api/translator/restart", {}); closeMenu(); }
});

// ------------------------------------------------------------------------------ go
connect();
paint();
post({ type: "ready" });
esIn.focus();
</script>
